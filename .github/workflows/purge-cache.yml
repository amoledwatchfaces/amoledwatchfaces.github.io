name: Purge Cloudflare Cache

on:
  push:
    branches:
      - main

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Identify changed URLs and purge Cloudflare cache
        run: |
          python3 -c "
          import json, subprocess, os, urllib.request

          zone_id = os.environ.get('CF_ZONE_ID')
          token = os.environ.get('CF_API_TOKEN')
          domain = 'https://amoledwatchfaces.com'

          try:
              output = subprocess.check_output(['git', 'diff', '--name-only', 'HEAD^', 'HEAD'], text=True)
              changed_files = [f.strip() for f in output.strip().split('\n') if f.strip()]
          except Exception as e:
              print(f'Error getting git diff: {e}')
              changed_files = []

          print('Changed files in commit:', changed_files)

          ignored_prefixes = ('.github/', '.git', 'README.md', '.gitignore', '.gitattributes')
          urls = set()

          for f in changed_files:
              if f.startswith(ignored_prefixes):
                  continue
              if f == 'CNAME':
                  continue

              if f == 'index.html':
                  urls.add(f'{domain}/')
                  urls.add(f'{domain}/index.html')
              elif f.endswith('.html'):
                  base = f[:-5]
                  urls.add(f'{domain}/{base}')
                  urls.add(f'{domain}/{f}')
              else:
                  urls.add(f'{domain}/{f}')

          url_list = list(urls)
          print('URLs to purge:', url_list)

          if not url_list:
              print('No web assets modified. Skipping purge.')
              exit(0)

          chunk_size = 30
          for i in range(0, len(url_list), chunk_size):
              chunk = url_list[i:i + chunk_size]
              payload = json.dumps({'files': chunk}).encode('utf-8')
              req = urllib.request.Request(
                  f'https://api.cloudflare.com/client/v4/zones/{zone_id}/purge_cache',
                  data=payload,
                  headers={
                      'Authorization': f'Bearer {token}',
                      'Content-Type': 'application/json'
                  },
                  method='POST'
              )
              try:
                  with urllib.request.urlopen(req) as resp:
                      res = json.loads(resp.read().decode())
                      print(f'Batch purge result: {res.get(\"success\")}')
                      if not res.get('success'):
                          print('Purge errors:', res.get('errors'))
                          exit(1)
              except Exception as err:
                  print(f'Purge request failed: {err}')
                  exit(1)

          print('Selective Cloudflare cache purge completed successfully!')
          "
        env:
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
