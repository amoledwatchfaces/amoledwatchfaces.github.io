name: Purge Cloudflare Cache

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wait for GitHub Pages deployment
        run: |
          echo "Waiting 60s for GitHub Pages deployment to finish before purging CDN cache..."
          sleep 60

      - name: Identify changed URLs and purge Cloudflare cache
        run: python3 scripts/purge_cloudflare_cache.py
        env:
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          COMMIT_BEFORE: ${{ github.event.before }}
          COMMIT_AFTER: ${{ github.event.after }}
          EVENT_NAME: ${{ github.event_name }}
