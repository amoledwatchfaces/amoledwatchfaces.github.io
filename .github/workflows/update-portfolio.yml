name: Sync Portfolio Sales & Updates

on:
  schedule:
    # Run every day after midnight local time (22:20 UTC = 00:20 CEST / 01:20 CET)
    # Off-peak minute (:20) avoids GitHub Actions top-of-the-hour queue delays
    - cron: '20 22 * * *'
  workflow_dispatch: # Allow manual run from Actions tab

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  sync-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run portfolio sync script
        run: python scripts/update_portfolio.py

      - name: Check for changes
        id: git-diff
        run: |
          if git diff --quiet data/portfolio.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "portfolio.json is up to date."
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "portfolio.json has updates to commit!"
          fi

      - name: Commit and push updates
        if: steps.git-diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/portfolio.json
          git commit -m "Auto-sync portfolio sales and dates from Google Play"
          git push

      - name: Build multilingual subdirectories
        if: steps.git-diff.outputs.changed == 'true'
        run: python scripts/build_i18n.py

      - name: Setup GitHub Pages
        if: steps.git-diff.outputs.changed == 'true'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: steps.git-diff.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        if: steps.git-diff.outputs.changed == 'true'
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Purge Cloudflare CDN Cache
        if: steps.git-diff.outputs.changed == 'true'
        env:
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          EVENT_NAME: workflow_dispatch
        run: python3 scripts/purge_cloudflare_cache.py
