name: Auto-Build Multilingual Pages

on:
  push:
    branches:
      - main
    paths:
      - 'locales/**'
      - '*.html'
      - 'scripts/build_i18n.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-i18n:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run multilingual build script
        run: python scripts/build_i18n.py

      - name: Check for changes
        id: git-diff
        run: |
          if git diff --quiet de/ es/ pl/ sk/ *.html; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "All multilingual pages are up to date."
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Multilingual pages have updates to commit!"
          fi

      - name: Commit and push updates
        if: steps.git-diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add de/ es/ pl/ sk/ *.html
          git commit -m "[skip ci] Auto-build multilingual pages (/de/, /es/, /pl/, /sk/)"
          git push
